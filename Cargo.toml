[package]
name = "imgfloat"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.39"
dioxus = { version = "0.6.2", features = ["fullstack", "router"] }
dioxus-fullstack = "0.6.2"
reqwest = { version = "0.11", features = ["json"] }
form_urlencoded = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1.12.0", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "js",
] }

async-trait = { version = "0.1.83", optional = true }
axum = { version = "0.7", features = [
    "ws",
    "multipart",
    "macros",
], optional = true }
bytes = { version = "1.9.0", optional = true }
cookie = { version = "0.18.1", features = ["secure"], optional = true }
diesel = { version = "2.2.0", features = [
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
    "chrono",
    "r2d2",
], optional = true }
dioxus-cli-config = { version = "0.6.2", optional = true }
dioxus-logger = { version = "0.6.2", optional = true }
dioxus-sdk = { version = "0.6.0", features = ["storage"], optional = true }
dotenvy = { version = "0.15", optional = true }
futures = { version = "0.3.31", optional = true }
http = { version = "1.2.0", optional = true }
js-sys = { version = "0.3.77", optional = true }
mime_guess = { version = "2.0.5", optional = true }
r2d2 = { version = "0.8.10", optional = true }
regex = { version = "1.11.1", optional = true }
sha2 = { version = "0.10.8", optional = true }
time = { version = "0.3.30", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tokio-native-tls = { version = "0.3.1", optional = true }
tokio-util = { version = "0.7.13", optional = true }
tower-http = { version = "0.6.2", features = ["trace"], optional = true }
tower-sessions = { version = "0.13.0", optional = true }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
], optional = true }
wasm-bindgen = { version = "0.2.92", optional = true }
web-sys = { version = "0.3.77", optional = true, features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlDocument",
    "Performance",
    "Window",
] }

[features]
default = []
server = [
    "async-trait",
    "axum",
    "bytes",
    "cookie",
    "diesel",
    "dioxus-cli-config",
    "dioxus/server",
    "dotenvy",
    "futures",
    "http",
    "mime_guess",
    "r2d2",
    "sha2",
    "time",
    "tokio",
    "tower-http",
    "tower-sessions",
    "tracing-subscriber",
]
web = [
    "dioxus/web",
    "dioxus-logger",
    "dioxus-sdk",
    "web-sys",
    "wasm-bindgen",
    "js-sys",
]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
